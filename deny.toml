[advisories]
version = 2
# Fail on known security vulnerabilities and unsound code.
# Unmaintained crates warn only — many transitive deps are stable but archived.
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "OpenSSL",
  "AGPL-3.0-or-later",
]
# Confidence threshold for SPDX expression parsing.
confidence-threshold = 0.8

[bans]
# Warn on duplicate versions — common in the ecosystem, deny would be too noisy.
multiple-versions = "warn"
wildcards = "allow"
deny = [
  # Project uses rustls; ban the openssl crate to prevent accidental linkage.
  { name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
