<div id="tip-shell-{{ match_id }}">
  {% if winner_only_mode %}
  <form hx-post="/predict/{{ match_id }}" hx-swap="outerHTML" hx-target="#tip-shell-{{ match_id }}" style="display:grid; grid-template-columns:1fr auto 1fr; align-items:stretch; gap:8px;">
    <button type="submit" name="outcome" value="home" class="pl-btn" style="display:flex; align-items:center; justify-content:flex-end; gap:8px; min-height:52px; padding:10px 12px; border:1.5px solid {% if score_home > score_away %}var(--pl-green){% else %}var(--pl-line){% endif %}; background:{% if score_home > score_away %}rgba(116,255,140,.12){% else %}rgba(255,255,255,.02){% endif %}; color:var(--pl-fg);">
      <span class="pl-display" style="font-size:13px; line-height:1.1; text-align:right;">{{ home_name }}</span>
      {% if home_flag.is_empty() == false %}<img src="{{ home_flag }}" alt="" style="width:24px; height:18px; object-fit:cover; border-radius:3px; flex-shrink:0;" onerror="this.style.display='none'">{% endif %}
    </button>
    {% if allow_draw_prediction %}
    <button type="submit" name="outcome" value="draw" class="pl-btn" aria-label="Unentschieden" style="width:52px; min-height:52px; padding:0; border-radius:999px; border:1.5px solid {% if score_home == score_away %}var(--pl-yellow){% else %}var(--pl-line){% endif %}; background:{% if score_home == score_away %}rgba(255,230,0,.12){% else %}rgba(255,255,255,.02){% endif %}; color:{% if score_home == score_away %}var(--pl-yellow){% else %}var(--pl-fg-2){% endif %}; font-size:22px; font-weight:700;">=</button>
    {% else %}
    <div style="width:52px; display:flex; align-items:center; justify-content:center; color:var(--pl-mute); font-size:20px;">→</div>
    {% endif %}
    <button type="submit" name="outcome" value="away" class="pl-btn" style="display:flex; align-items:center; justify-content:flex-start; gap:8px; min-height:52px; padding:10px 12px; border:1.5px solid {% if score_home < score_away %}var(--pl-green){% else %}var(--pl-line){% endif %}; background:{% if score_home < score_away %}rgba(116,255,140,.12){% else %}rgba(255,255,255,.02){% endif %}; color:var(--pl-fg);">
      {% if away_flag.is_empty() == false %}<img src="{{ away_flag }}" alt="" style="width:24px; height:18px; object-fit:cover; border-radius:3px; flex-shrink:0;" onerror="this.style.display='none'">{% endif %}
      <span class="pl-display" style="font-size:13px; line-height:1.1; text-align:left;">{{ away_name }}</span>
    </button>
  </form>
  {% else %}
  <form id="tip-form-{{ match_id }}" hx-post="/predict/{{ match_id }}" hx-swap="outerHTML" hx-target="#tip-shell-{{ match_id }}" style="display:flex; align-items:center; gap:6px;">
    <input class="pl-num" type="number" name="score_home" min="0" max="20" value="{{ score_home }}" required style="width:42px; height:42px; text-align:center; background:#06090a; border:1.5px solid var(--pl-green); border-radius:8px; color:var(--pl-fg); font-size:18px; outline:none; box-shadow:0 0 12px rgba(116,255,140,.3);">
    <span class="pl-mono" style="color:var(--pl-mute);">:</span>
    <input class="pl-num" type="number" name="score_away" min="0" max="20" value="{{ score_away }}" required style="width:42px; height:42px; text-align:center; background:#06090a; border:1.5px solid var(--pl-green); border-radius:8px; color:var(--pl-fg); font-size:18px; outline:none; box-shadow:0 0 12px rgba(116,255,140,.3);">
    <button type="submit" class="pl-btn pl-btn--primary" style="height:42px; padding:0 12px; font-size:11px;">OK</button>
  </form>
  {% endif %}
</div>
