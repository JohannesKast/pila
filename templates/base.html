<!DOCTYPE html>
<html lang="{{ lang_code }}" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://flagcdn.com; connect-src 'self';">
    <title>Pila — WM Tippspiel</title>
    <link rel="icon" type="image/svg+xml" href="/static/pila-logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/tokens.css">
    <!-- Tailwind compiled at build time (see tailwind.config.js). Linked after
         tokens.css so preflight + utilities sit after the token layer. -->
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <meta name="csrf-token-name" content="pila_csrf">
    <meta name="csrf-header-name" content="X-CSRF-Token">
    <script>
        document.addEventListener('htmx:configRequest', (event) => {
            const cookies = document.cookie.split('; ');
            const token = cookies.find(row => row.startsWith('pila_csrf='))?.split('=')[1];
            if (token) {
                event.detail.headers['X-CSRF-Token'] = token;
            }
        });
    </script>
</head>
<body class="pl-app min-h-screen">
    {% block topbar %}{% endblock %}
    <div id="sheet"></div>
    <main class="w-full mx-auto pb-6">
        {% block content %}{% endblock %}
    </main>
    <footer class="w-full text-center py-8 text-sm text-pl-mute font-mono border-t border-pl-line mt-8">
        Made with ❤️ in Dossenheim - EU 🇪🇺 ·
        <a href="https://github.com/JohannesKast/pila" class="underline hover:text-pl-fg">Source code</a>
        (AGPL-3.0-or-later)
    </footer>
</body>
</html>
