{# Jersey SVG macro — usage:
   {% import "partials/jersey.html" as j %}
   {% call j::jersey_svg(preset.body, preset.accent, preset.pattern, 28, "u-1") %}{% endcall %}
   `uid` MUST be unique per page for pattern <defs> id namespacing. #}
{% macro jersey_svg(body, accent, pattern, size, uid) %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}" style="display:inline-block; flex-shrink:0;" aria-hidden="true">
  {% if pattern != "solid" %}
  <defs>
    {% if pattern == "vstripes" %}
    <pattern id="jp-{{ uid }}" width="14" height="100" patternUnits="userSpaceOnUse">
      <rect width="14" height="100" fill="{{ body }}"/>
      <rect x="7" width="7" height="100" fill="{{ accent }}"/>
    </pattern>
    {% else if pattern == "hoops" %}
    <pattern id="jp-{{ uid }}" width="100" height="20" patternUnits="userSpaceOnUse">
      <rect width="100" height="20" fill="{{ body }}"/>
      <rect y="10" width="100" height="10" fill="{{ accent }}"/>
    </pattern>
    {% else if pattern == "halves" %}
    <linearGradient id="jp-{{ uid }}" x1="0" x2="1" y1="0" y2="0">
      <stop offset="50%" stop-color="{{ body }}"/>
      <stop offset="50%" stop-color="{{ accent }}"/>
    </linearGradient>
    {% else if pattern == "sash" %}
    <pattern id="jp-{{ uid }}" width="141" height="141" patternUnits="userSpaceOnUse" patternTransform="rotate(-50)">
      <rect width="141" height="141" fill="{{ body }}"/>
      <rect y="60" width="141" height="22" fill="{{ accent }}"/>
    </pattern>
    {% else if pattern == "vbands" %}
    <pattern id="jp-{{ uid }}" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="33" fill="{{ body }}"/>
      <rect y="33" width="100" height="34" fill="{{ accent }}"/>
      <rect y="67" width="100" height="33" fill="{{ body }}"/>
    </pattern>
    {% else if pattern == "check" %}
    <pattern id="jp-{{ uid }}" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="{{ body }}"/>
      <rect width="11" height="11" fill="{{ accent }}"/>
      <rect x="11" y="11" width="11" height="11" fill="{{ accent }}"/>
    </pattern>
    {% endif %}
  </defs>
  {% endif %}
  <path d="M 25 10 L 35 7 L 42 12 L 50 22 L 58 12 L 65 7 L 75 10 L 86 26 L 76 33 L 76 92 L 24 92 L 24 33 L 14 26 Z"
        fill="{% if pattern == "solid" %}{{ body }}{% else %}url(#jp-{{ uid }}){% endif %}"
        stroke="rgba(0,0,0,.45)" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 25 10 L 35 7 L 35 26 L 24 33 L 14 26 Z" fill="{{ accent }}" opacity=".85" stroke="rgba(0,0,0,.3)" stroke-width="1"/>
  <path d="M 75 10 L 65 7 L 65 26 L 76 33 L 86 26 Z" fill="{{ accent }}" opacity=".85" stroke="rgba(0,0,0,.3)" stroke-width="1"/>
  <path d="M 42 12 L 50 22 L 58 12" fill="none" stroke="{{ accent }}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
{% endmacro %}
