{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto p-6">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:20px;">
        <a href="/admin/leagues" class="pl-mono text-xs" style="color:var(--pl-mute);">←  {{ t.get("league-list") }}</a>
    </div>

    <h1 class="pl-display" style="font-size:22px; margin-bottom:18px;">+ {{ t.get("league-create") }}</h1>

    <form action="/admin/leagues" method="POST" class="pl-card" style="padding:18px; display:flex; flex-direction:column; gap:14px;">
        <label class="pl-mono" style="font-size:11px; color:var(--pl-mute); letter-spacing:.08em; text-transform:uppercase;">
            {{ t.get("league-name") }}
            <input type="text" name="name" required maxlength="255" placeholder="{{ t.get("league-name-placeholder") }}"
                   style="margin-top:6px; width:100%; background:var(--pl-bg-2); border:1.5px solid var(--pl-line); color:var(--pl-fg); font-size:14px; border-radius:6px; padding:10px 12px; outline:none;">
        </label>
        <button type="submit" class="pl-btn pl-btn--primary" style="padding:10px;">{{ t.get("league-create-btn") }}</button>
    </form>
</div>
{% endblock %}
