name: Feature Request
description: Suggest a user-facing or technical improvement for Pila
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem first, then the change you want.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
      placeholder: It is currently hard to ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What would you like to happen?
      placeholder: Add a way to ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What workarounds or alternatives have you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, links, screenshots, or examples
