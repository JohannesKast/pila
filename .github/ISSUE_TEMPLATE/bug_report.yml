name: Bug Report
description: Report a reproducible bug in Pila
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please include enough detail to reproduce the issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can someone trigger the bug reliably?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or Commit
      description: Tag, branch, or commit SHA if known
      placeholder: v0.1.0 or abc1234
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      description: Where did you hit the bug?
      options:
        - Docker Compose
        - Local cargo run
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste relevant logs, traces, or screenshots
      render: shell
