services:
  db:
    image: postgres:15-alpine
    container_name: pila_db
    environment:
      POSTGRES_USER: pila
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pila_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pila -d pila_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${PILA_IMAGE:-ghcr.io/johanneskast/pila:latest}
    container_name: pila_app
    ports:
      - "8000:8000"
    # Security hardening: drop all capabilities, prevent privilege
    # escalation, and mount the root filesystem read-only.  /tmp is a
    # tmpfs so the occasional scratch write (e.g. tokio blocking pool)
    # still works.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
        reservations:
          memory: 128M
    mem_swappiness: 0
    environment:
      DATABASE_URL: postgres://pila:${POSTGRES_PASSWORD}@db:5432/pila_db
      RUST_LOG: info
      # Internal Docker network — TLS not needed between containers.
      SIGNAL_API_URL: ${SIGNAL_API_URL:-http://signal-cli:8080}
      SIGNAL_FROM_NUMBER: ${SIGNAL_FROM_NUMBER:-}
      SIGNAL_GROUP_ID: ${SIGNAL_GROUP_ID:-}
      BASE_URL: ${BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
      signal-cli:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: pila_signal
    environment:
      MODE: native
    volumes:
      - signal_cli_config:/home/.local/share/signal-cli
    # The REST API is only reached by the app container over the
    # internal Docker network (hostname `signal-cli`).  Do NOT expose
    # this port to the host unless you are debugging registration.
    # ports:
    #   - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F90' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
  signal_cli_config:
